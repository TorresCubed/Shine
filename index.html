<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Shine</title>
    <meta name="description" content="Shine: a puzzle game about light and the dark. Carry a candle through a dark house, bounce a flashlight off mirrors, and light the way out. Real ray-traced light, hand-drawn art." />
    <link rel="canonical" href="https://shine-game.vercel.app/" />
    <!-- Link previews (Open Graph, and X/Twitter's card): read by each site's crawler from this HTML,
         so the image is a fixed, full URL (public/preview.png, served as-is at the site root). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shine" />
    <meta property="og:url" content="https://shine-game.vercel.app/" />
    <meta property="og:title" content="Shine" />
    <meta property="og:description" content="A puzzle game about light and the dark, with real ray-traced light. Play it in your browser." />
    <meta property="og:image" content="https://shine-game.vercel.app/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A pixel-art candle glowing in the dark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shine" />
    <meta name="twitter:description" content="A puzzle game about light and the dark, with real ray-traced light. Play it in your browser." />
    <meta name="twitter:image" content="https://shine-game.vercel.app/preview.png" />
    <meta name="theme-color" content="#000000" />
    <!-- The top of the title screen's candle (cropped from largeCandle.png, doubled, pixels as drawn). -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/src/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
