<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Shine</title>
    <meta name="description" content="Shine: a puzzle game about light and the dark. Carry a candle through a dark house, bounce a flashlight off mirrors, and light the way out. Real ray-traced light, hand-drawn art." />
    <meta property="og:title" content="Shine" />
    <meta property="og:description" content="A puzzle game about light and the dark, with real ray-traced light." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <!-- The top of the title screen's candle (cropped from largeCandle.png, doubled, pixels as drawn). -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/src/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #f5c542;
        --gold-dim: #b8913a;
        --text: #e8e0d0;
        --muted: #9a8f80;
        --panel: rgba(14, 11, 9, 0.95);
        --line: rgba(245, 197, 66, 0.25);
        --display: 'Cinzel', 'Times New Roman', serif;
        --body: 'EB Garamond', Georgia, serif;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
      }
      /* Taps are game input: no double-tap zoom, scrolling or text selection. */
      #game {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Menus: an overlay over the game, which keeps drawing behind it. */
      .menu-overlay {
        position: fixed; inset: 0; z-index: 10;
        display: none; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.85) 75%);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
        color: var(--text); font: 19px/1.45 var(--body);
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .menu-overlay.open { display: flex; animation: menu-in 300ms ease-out; }
      @keyframes menu-in { from { opacity: 0; } }
      .menu-panel {
        width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto;
        box-sizing: border-box; padding: 28px 28px 24px; text-align: center;
      }
      .menu-overlay:not([data-screen="title"]):not([data-screen="ending"]) .menu-panel {
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      }
      .game-title {
        font: 700 clamp(56px, 14vw, 104px)/1 var(--display); letter-spacing: 0.08em; margin: 0 0 6px;
        color: var(--gold);
        text-shadow: 0 0 18px rgba(245, 197, 66, 0.55), 0 0 60px rgba(255, 150, 40, 0.35);
        animation: flicker 4s infinite;
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; } 42% { opacity: 0.93; } 44% { opacity: 1; } 71% { opacity: 0.96; } 73% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { .game-title { animation: none; } }
      .tagline { font-style: italic; color: var(--text); margin: 0 0 28px; }
      .byline { color: var(--muted); margin: 28px 0 0; font-size: 16px; }
      .muted { color: var(--muted); margin: 0 0 16px; }
      h2 { font: 500 30px var(--display); letter-spacing: 0.06em; color: var(--gold); margin: 0 0 10px; }
      .menu-list { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .menu-row { display: flex; justify-content: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      .menu-item {
        min-width: 240px; padding: 10px 20px; border-radius: 6px; cursor: pointer;
        font: 19px var(--body); color: var(--text);
        background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.14);
        transition: border-color 120ms, color 120ms, background 120ms;
      }
      .menu-item:hover, .menu-item:focus-visible { border-color: var(--gold); color: var(--gold); outline: none; background: rgba(245, 197, 66, 0.08); }
      .menu-item.primary { border-color: var(--gold-dim); color: var(--gold); }
      .menu-item.quiet { min-width: 0; color: var(--muted); }
      .menu-back { min-width: 140px; margin-top: 18px; }
      .menu-row .menu-back { margin-top: 0; }

      /* In the menus' option lists (the pause menu, the ending), not the title screen's, and not on Back,
         Reset progress or the level tiles, a hovered (or keyboard-focused) option gets a flashlight just to its left,
         shining a 10° beam across it. The flashlight is the game's own art (--flashlight, set in
         menu.ts): 32 x 18 at (13, 20) in its 64px image, the lens on its right edge, at 1x, 18px clear
         of the option. The beam leaves the lens as tall as the lens and spreads at 10° (2·tan 5° = 0.175
         of its length) most of the way across the option, brightest at the lens. */
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item { position: relative; }
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item::before,
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item::after {
        content: ''; position: absolute; top: 50%; pointer-events: none;
        opacity: 0; transition: opacity 160ms ease;
      }
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item::before {
        left: -50px; width: 32px; height: 18px; margin-top: -9px; z-index: 1; /* over its beam */
        background: var(--flashlight) -13px -20px / 64px 64px no-repeat; image-rendering: pixelated;
      }
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item::after {
        /* From the lens (1px under the flashlight's front), reaching 90% of the way to the option's far
           end; as tall as the lens (18px), plus how much a 10° cone spreads over that reach: 0.175 of
           it, 15.75% of the option's width (padding % is of the width). */
        left: -19px; width: calc((100% + 19px) * 0.9); height: 18px; padding-top: 15.75%; transform: translateY(-50%);
        clip-path: polygon(0 calc(50% - 9px), 100% 0, 100% 100%, 0 calc(50% + 9px));
        /* Falls off like the game's lights (LIGHT_FALLOFF_STOPS: full, 90% at 0.4 of its reach, nothing
           at the end), so it fades out at its tip rather than stopping. */
        background: radial-gradient(ellipse 100% 100% at 0 50%,
          rgba(255, 240, 190, 0.48), rgba(255, 225, 160, 0.432) 40%, rgba(255, 205, 130, 0) 100%);
        mix-blend-mode: screen;
      }
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item:is(:hover, :focus-visible)::before,
      .menu-overlay:not([data-screen="title"]) .menu-list .menu-item:is(:hover, :focus-visible)::after { opacity: 1; }

      .level-grid {
        text-align: left; margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
      .level-tile {
        position: relative; min-width: 0; padding: 8px 10px 10px; text-align: left;
        display: flex; flex-direction: column; gap: 2px; line-height: 1.2;
      }
      .level-number { font: 700 20px var(--display); color: var(--gold-dim); }
      .level-name { font-size: 15px; }
      .level-check { position: absolute; top: 6px; right: 9px; color: #7cc47a; font-size: 16px; }
      .level-tile.done .level-number { color: var(--gold); }

      .rules { text-align: left; margin-bottom: 14px; }
      .rules p { margin: 0 0 8px; }
      .controls { width: 100%; border-collapse: collapse; font-size: 16px; text-align: left; }
      .controls th { font: 500 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); padding: 4px 6px; }
      .controls td { padding: 5px 6px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
      .controls .key { color: var(--gold); white-space: nowrap; }

      .credits { margin: 8px 0 14px; }
      .credits dt { font: 500 13px var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-dim); margin-top: 10px; }
      .credits dd { margin: 2px 0 0; }
      .links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 6px 0 4px; }
      .links a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--line); }
      .links a:hover { border-color: var(--gold); }

      /* The candle behind the title (splash.ts): over the game, under the menus. */
      .splash {
        position: fixed; inset: 0; z-index: 9; overflow: hidden; background: #000;
        opacity: 0; pointer-events: none; transition: opacity 700ms ease;
      }
      .splash.shown { opacity: 1; pointer-events: auto; }
      .splash-rig { position: absolute; left: 0; top: 0; will-change: transform; }
      .splash-glow {
        position: absolute; border-radius: 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(circle,
          rgba(255, 222, 150, 0.6) 0%, rgba(255, 180, 80, 0.36) 6%, rgba(240, 130, 45, 0.18) 18%,
          rgba(160, 70, 20, 0.08) 34%, rgba(60, 25, 8, 0.03) 50%, rgba(0, 0, 0, 0) 62%);
      }
      .splash-candle { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; user-select: none; -webkit-user-drag: none; }
      /* The title floats over the candle's light, up top, clear of the candle. */
      .menu-overlay[data-screen="title"] { background: transparent; }
      .menu-overlay[data-screen="title"] .menu-panel { margin-bottom: 12vh; } /* centred, a little high: clear of the candle */
      /* Dark, so the candle's light behind it doesn't wash it out. */
      .menu-overlay[data-screen="title"] .byline { color: whitesmoke; font-weight: 500; }

      /* During play. */
      .menu-button {
        position: fixed; z-index: 5; display: none;
        top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px);
        width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
        border: 2px solid rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.45); color: rgba(255, 255, 255, 0.8);
        font: 20px sans-serif; -webkit-tap-highlight-color: transparent;
      }
      .menu-button.shown { display: block; }
      .menu-button:hover { border-color: var(--gold); color: var(--gold); }
      .hint, .level-card {
        position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
        pointer-events: none; opacity: 0; transition: opacity 600ms ease;
        color: var(--text); text-align: center;
      }
      .hint {
        bottom: calc(env(safe-area-inset-bottom) + 24px); width: max-content; max-width: min(620px, calc(100vw - 32px));
        padding: 9px 18px; border-radius: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--line);
        font: 18px/1.35 var(--body);
      }
      .hint.touch { bottom: calc(env(safe-area-inset-bottom) + 96px); } /* above the aim buttons */
      .level-card { top: calc(env(safe-area-inset-top) + 18px); display: flex; flex-direction: column; gap: 2px; max-width: calc(100vw - 140px); }
      .card-number { font: 500 13px var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-dim); }
      .card-title { font: 500 26px var(--display); letter-spacing: 0.05em; color: var(--gold); text-shadow: 0 0 14px rgba(0, 0, 0, 0.9); }
      .hint.shown, .level-card.shown { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
